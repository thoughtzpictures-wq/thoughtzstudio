backend:
  name: git-gateway
  branch: main

media_folder: "images/galleries"
public_folder: "/images/galleries"

collections:
  - name: "galleries"
    label: "Client Galleries"
    folder: "content/galleries"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Project Slug / URL ID", name: "slug", widget: "string" }
      - { label: "Client / Project Title", name: "title", widget: "string" }
      - { label: "Scene Name", name: "scene", widget: "string" }
      - { label: "Gallery Folder Name", name: "folder", widget: "string", help: "Type the exact folder name created inside images/galleries (e.g., family-shoot)" }
